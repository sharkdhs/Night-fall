<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIGHTFALL — 밤의 생존자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--cyan:#5ef2ff;--pink:#ff4fd8;--violet:#c77dff;--gold:#ffd166;--red:#ff4f6a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#06070c;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.bh{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpwrap{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px)}
#xpbar{height:14px;border-radius:8px;background:rgba(8,8,20,.65);border:1px solid rgba(255,255,255,.16);overflow:hidden;position:relative}
#xpfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3b8bff,#5ef2ff 55%,#c77dff);box-shadow:0 0 14px #5ef2ff;transition:width .12s}
#lvl{position:absolute;left:8px;top:-1px;font-size:11px;font-weight:900;letter-spacing:.04em;text-shadow:0 1px 2px #000}
#toprow{position:relative;margin-top:6px;min-height:64px}
#slots{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:4px}
.srow{display:flex;gap:3px}
.slot{width:30px;height:30px;border-radius:8px;background:rgba(10,10,28,.7);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px;position:relative}
.slot.w{border-color:rgba(94,242,255,.45)}.slot.p{border-color:rgba(255,79,216,.4)}
.slot i{position:absolute;right:-3px;bottom:-5px;font-style:normal;font-size:9px;font-weight:900;background:#141432;border-radius:5px;padding:0 3px;border:1px solid rgba(255,255,255,.25)}
.slot.max i{background:linear-gradient(90deg,#ffd166,#ff9b3d);color:#2a1300;border-color:#ffd166}
#center{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center}
#timer{font-size:32px;line-height:1;text-shadow:0 0 14px rgba(94,242,255,.6),0 2px 4px #000;letter-spacing:.04em}
#timer.danger{color:#ff6b81;text-shadow:0 0 16px rgba(255,60,90,.8)}
#nextev{font-size:11px;opacity:.75;margin-top:3px;font-weight:700;text-shadow:0 1px 2px #000}
#right{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#kills{font-weight:900;font-size:14px;text-shadow:0 1px 3px #000}
#score{font-weight:900;font-size:14px;color:#ffd166;text-shadow:0 0 8px rgba(255,200,80,.6),0 1px 3px #000}
.ibtns{display:flex;gap:6px;margin-top:2px}
.ibtn{pointer-events:auto;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(12,12,30,.6);font-size:16px;display:grid;place-items:center;cursor:pointer}
#live{margin-top:4px;min-width:130px;max-width:170px;background:rgba(8,8,22,.6);border:1px solid rgba(94,242,255,.25);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:700}
#live .lh{color:#5dff9a;font-size:10px;letter-spacing:.08em;margin-bottom:2px}
#live .lr{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
#live .lr span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:95px}
#live .lr.ahead span:last-child{color:#ff6b81}
#bosswrap{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 92px);width:min(70vw,460px);text-align:center}
#bossname{font-size:16px;color:#ffb3c1;text-shadow:0 0 10px rgba(255,40,80,.8),0 2px 3px #000;margin-bottom:4px}
#bossbar{height:12px;border-radius:7px;background:rgba(30,0,10,.75);border:1px solid rgba(255,90,120,.55);overflow:hidden;box-shadow:0 0 18px rgba(255,40,80,.35)}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff2e63,#ff6b3d);transition:width .1s}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:6;pointer-events:none;padding:0 16px}
#banner .b{display:inline-block;font-size:clamp(22px,6.4vw,42px);padding:8px 26px;border-radius:14px;animation:ban 2.6s ease forwards;text-shadow:0 0 18px currentColor,0 3px 6px #000;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55),transparent)}
#banner .b.warn{color:#ff6b81}#banner .b.gold{color:#ffd166}#banner .b.info{color:#9ef6ff}#banner .b.skill{color:#ffffff}
#banner .b small{display:block;font-family:'Noto Sans KR';font-size:13px;font-weight:700;color:#fff;opacity:.85;margin-top:4px;text-shadow:0 1px 3px #000}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 176px);z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast{background:rgba(10,10,30,.85);border:1px solid rgba(255,209,102,.5);border-radius:12px;padding:7px 14px;font-size:13px;font-weight:700;box-shadow:0 0 18px rgba(255,200,80,.25);animation:toast 4.2s ease forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#actions{--u:clamp(52px,9.5vmin,76px);position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:calc(var(--u)*2.75);height:calc(var(--u)*2.75);pointer-events:none;z-index:6}
.abtn{position:absolute;border:none;border-radius:50%;pointer-events:auto;display:grid;place-items:center;touch-action:none;cursor:pointer;padding:0;
 background:conic-gradient(var(--c) calc(var(--p,1)*1turn),rgba(255,255,255,.07) 0);box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .08s}
.abtn:active{transform:scale(.93)}
.abtn span{width:86%;height:86%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(42,47,92,.92),rgba(12,13,34,.92));display:grid;place-items:center;font-weight:900;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.abtn.ready span{box-shadow:inset 0 0 0 2px var(--c),0 0 18px var(--c)}
.abtn kbd{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:6px;background:#141432;border:1px solid rgba(255,255,255,.3);font-family:inherit;font-size:9px;font-weight:900;line-height:16px;color:#fff;opacity:.85}
.abtn .cdn{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff;text-shadow:0 0 6px #000;background:rgba(0,0,0,.5);border-radius:50%}
#dashBtn{--c:rgba(94,242,255,.95);width:calc(var(--u)*1.25);height:calc(var(--u)*1.25);right:calc(var(--u)*.17);bottom:calc(var(--u)*.17)}
#dashBtn span{font-size:calc(var(--u)*.2);letter-spacing:.06em;color:#bff8ff}
#skillBtn{--c:rgba(255,209,102,.95);width:calc(var(--u)*.98);height:calc(var(--u)*.98);right:calc(var(--u)*.68);bottom:calc(var(--u)*1.67)}
#skillBtn span{font-size:calc(var(--u)*.42)}
#skillBtn .cdn{font-size:calc(var(--u)*.3)}
#skillBtn.ready{animation:sk 1.2s ease-in-out infinite}
@keyframes sk{50%{transform:scale(1.06)}}
#gadBtn{--c:rgba(255,79,216,.95);width:calc(var(--u)*.86);height:calc(var(--u)*.86);right:calc(var(--u)*1.72);bottom:calc(var(--u)*.73)}
#gadBtn span{font-size:calc(var(--u)*.38)}
#gadBtn .cdn{font-size:calc(var(--u)*.26)}
.lo{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.loh{display:flex;gap:8px;align-items:center}
.loh .k{font-weight:900;font-size:11px;padding:1px 7px;border-radius:6px}
.k.gd{background:rgba(255,79,216,.2);color:#ffb3f0}.k.sp{background:rgba(120,255,170,.18);color:#b8ffd2}
.lorow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lob{border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:12px;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lob b{font-size:12.5px}.lob span{font-size:10.5px;opacity:.72;line-height:1.35}
.lob.sel{border-color:#ffd166;background:rgba(255,209,102,.12);box-shadow:0 0 14px -6px #ffd166}

/* Screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;
 padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);overflow-y:auto;touch-action:pan-y}
.screen.dim{background:radial-gradient(ellipse at center,rgba(14,8,34,.8),rgba(0,0,0,.92));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.logo{text-align:center}
.logo-main{font-size:clamp(50px,14vw,112px);line-height:.95;letter-spacing:.05em;background:linear-gradient(180deg,#ffffff 0%,#9ef6ff 38%,#c77dff 78%,#ff4fd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(140,90,255,.75));animation:pulse 3s ease-in-out infinite}
.logo-sub{font-size:clamp(16px,4.6vw,26px);letter-spacing:.5em;margin-top:6px;color:#ffd6f5;text-shadow:0 0 14px #ff4fd8;padding-left:.5em}
@keyframes pulse{50%{filter:drop-shadow(0 0 34px rgba(160,100,255,.95))}}
.tag{font-size:13px;opacity:.8;text-align:center;max-width:460px;line-height:1.6}
.sectitle{font-size:12px;letter-spacing:.3em;color:#9ef6ff;opacity:.9}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;padding:8px 18px;border-radius:999px;font-weight:900;font-size:14px;cursor:pointer;opacity:.6}
.seg button.sel{opacity:1;background:linear-gradient(90deg,rgba(94,242,255,.25),rgba(199,125,255,.3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.seg button[data-d="nm"].sel{background:linear-gradient(90deg,rgba(255,60,90,.35),rgba(255,120,40,.3));color:#ffb3c1}
.cgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:100%;max-width:680px}
.ctile{position:relative;border-radius:14px;padding:4px 2px 6px;background:linear-gradient(180deg,rgba(30,26,60,.75),rgba(12,10,28,.85));border:2px solid rgba(255,255,255,.08);cursor:pointer;text-align:center;transition:transform .12s,border-color .12s,box-shadow .12s}
.ctile canvas{width:100%;aspect-ratio:1;display:block}
.ctile .nm{font-size:12px;font-weight:900;margin-top:-4px}
.ctile.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 22px -6px var(--c);transform:translateY(-3px)}
.ctile.locked canvas{filter:grayscale(1) brightness(.35)}
.ctile.locked .nm{opacity:.45}
.ctile .lk{position:absolute;top:22%;left:0;right:0;font-size:20px}
.cdetail{width:100%;max-width:560px;border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,rgba(32,28,70,.85),rgba(14,12,32,.9));border:1px solid rgba(255,255,255,.12);font-size:13px;line-height:1.55}
.cdetail .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cdetail .hd b{font-family:'Black Han Sans';font-weight:400;font-size:22px}
.cdetail .hd em{font-style:normal;font-weight:900;font-size:12px;color:var(--c)}
.cdetail .ln{display:flex;gap:8px;margin-top:3px}
.cdetail .ln .k{flex:none;font-weight:900;font-size:11px;padding:1px 7px;border-radius:6px;height:fit-content;margin-top:2px}
.k.tr{background:rgba(255,79,216,.2);color:#ffb3f0}.k.sk{background:rgba(255,209,102,.2);color:#ffe29a}.k.wp{background:rgba(94,242,255,.18);color:#bff8ff}.k.lk{background:rgba(255,255,255,.12)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chips b{font-size:11px;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px}
.btn{font-family:'Black Han Sans','Noto Sans KR';font-size:22px;padding:13px 44px;border-radius:999px;border:none;cursor:pointer;color:#140a24;background:linear-gradient(90deg,#5ef2ff,#c77dff 60%,#ff4fd8);box-shadow:0 0 34px -6px #8a5cff,inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn:disabled{filter:grayscale(1);opacity:.5}
.btn.ghost{background:rgba(255,255,255,.05);color:#d8dcff;border:1.5px solid rgba(255,255,255,.22);font-size:15px;padding:10px 22px;box-shadow:none;font-family:'Noto Sans KR';font-weight:700}
.btn.gold{background:linear-gradient(90deg,#ffd166,#ff9b3d);font-size:17px;padding:11px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.howto{font-size:12px;opacity:.6;text-align:center;line-height:1.7}
.howto kbd{font-family:inherit;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:0 5px;font-size:11px}
.best{font-size:13px;color:#ffd166;font-weight:700;text-align:center}
#lobby{width:100%;max-width:560px;font-size:12px}
.lobbybox{border-radius:14px;padding:9px 12px;background:rgba(93,255,154,.06);border:1px solid rgba(93,255,154,.25)}
.lobbybox .t{font-weight:900;color:#5dff9a;margin-bottom:4px}
.lobbybox .p{display:flex;justify-content:space-between;gap:8px;padding:2px 0;opacity:.9}
.lv-title{font-size:clamp(40px,11vw,68px);background:linear-gradient(180deg,#fff,#ffd166 60%,#ff9b3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,190,80,.7));line-height:1;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.lv-sub{font-size:13px;opacity:.75;margin-top:-6px}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;max-width:520px}
.card{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:18px;cursor:pointer;background:linear-gradient(135deg,rgba(32,28,70,.92),rgba(14,12,32,.95));border:2px solid rgba(255,255,255,.12);position:relative;overflow:hidden;animation:cardin .35s ease backwards;transition:transform .1s}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@keyframes cardin{from{transform:translateY(24px);opacity:0}}
.card:active{transform:scale(1.02)}
.card.new{border-color:rgba(255,209,102,.75);box-shadow:0 0 26px -8px #ffd166}
.card.up{border-color:rgba(94,242,255,.6);box-shadow:0 0 26px -10px #5ef2ff}
.card.pas{border-color:rgba(255,79,216,.55);box-shadow:0 0 26px -10px #ff4fd8}
.card .ci{width:54px;height:54px;flex:none;border-radius:14px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),rgba(0,0,0,.25));display:grid;place-items:center;font-size:30px}
.card .cn{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .tg{font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px;background:#ffd166;color:#2a1600}
.card.up .tg{background:#5ef2ff;color:#00222a}.card.pas .tg{background:#ff4fd8;color:#2a0020}
.card .cd{font-size:13px;opacity:.82;margin-top:3px;line-height:1.45}
.card .dots{margin-top:6px;display:flex;gap:4px}
.card .dots s{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);text-decoration:none}
.card .dots s.on{background:#5ef2ff;box-shadow:0 0 6px #5ef2ff}
.card .dots s.nx{background:#ffd166;animation:blink .7s infinite}
.card .key{position:absolute;right:12px;top:10px;font-size:11px;opacity:.35;font-weight:900}
@keyframes blink{50%{opacity:.35}}
.h1{font-size:clamp(34px,9vw,60px);line-height:1}
.build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.bitem{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700}
.bitem em{font-style:normal;color:#5ef2ff;font-size:11px}
.bigscore{font-size:clamp(40px,12vw,64px);color:#ffd166;text-shadow:0 0 22px rgba(255,190,80,.6);line-height:1}
.netline{font-size:13px;font-weight:700;text-align:center;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:440px}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 4px;text-align:center}
.stat .v{font-size:20px;font-family:'Black Han Sans'}
.stat .k{font-size:10px;opacity:.65;font-weight:700}
.dmg{width:100%;max-width:440px;display:flex;flex-direction:column;gap:5px}
.drow{display:grid;grid-template-columns:22px 84px 1fr 56px;align-items:center;gap:8px;font-size:12px;font-weight:700}
.drow .bar{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.drow .bar div{height:100%;background:linear-gradient(90deg,#5ef2ff,#c77dff)}
.drow .n{text-align:right;opacity:.8}
#overTitle.win{background:linear-gradient(180deg,#fff,#ffe29a 50%,#ff9b3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,200,90,.8))}
#overTitle.lose{color:#ff6b81;text-shadow:0 0 22px rgba(255,40,80,.8)}
#overSub{font-size:13px;opacity:.8;text-align:center;margin-top:-4px}
.newrec{color:#ffd166;font-weight:900;font-size:14px;animation:blink 1s infinite;text-align:center}
.lbtabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:560px}
.lbtabs button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:900;cursor:pointer}
.lbtabs button.sel{background:rgba(255,209,102,.2);border-color:#ffd166}
.lblist{width:100%;max-width:560px;display:flex;flex-direction:column;gap:5px}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.lbrow.me{border-color:#5ef2ff;background:rgba(94,242,255,.1)}
.lbrow .rk{font-family:'Black Han Sans';font-size:20px;text-align:center}
.lbrow:nth-child(1) .rk{color:#ffd166}.lbrow:nth-child(2) .rk{color:#d6e2ff}.lbrow:nth-child(3) .rk{color:#ffb07a}
.lbrow .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .sub{font-size:11px;opacity:.65;margin-top:1px}
.lbrow .sc{font-family:'Black Han Sans';font-size:19px;color:#ffd166;text-align:right}
.badge{display:inline-block;font-size:9px;font-weight:900;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:2px}
.badge.nm{background:#ff4f6a;color:#fff}.badge.win{background:#ffd166;color:#2a1600}
.note{font-size:12px;opacity:.7;text-align:center;max-width:460px;line-height:1.6}
#pvhud{position:fixed;inset:0;pointer-events:none;z-index:5}
#pvtop{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);text-align:center}
#pvtimer{font-size:30px;line-height:1;text-shadow:0 0 14px rgba(255,79,216,.6),0 2px 4px #000}
#pvlv{font-size:11px;font-weight:700;opacity:.8;margin-top:3px;text-shadow:0 1px 2px #000}
#pvscore{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px auto 0;max-width:94vw}
#pvscore span{font-size:12px;font-weight:700;background:rgba(10,10,28,.7);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:3px 8px}
#pvscore span.me{border-color:#5ef2ff}#pvscore b{color:#ffd166}

<script>
'use strict';
const $=id=>document.getElementById(id);
const cvs=$('game'),ctx=cvs.getContext('2d');
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lerpAngle(a,b,t){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*Math.min(1,t)}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}return `rgb(${r|0},${g|0},${b|0})`}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);fn(c.getContext('2d'),c.width,c.height);return c}
function fmtTime(t){t=Math.max(0,t|0);return String((t/60)|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function fmtNum(n){n=Math.round(n);return n>=100000?(n/1000).toFixed(0)+'k':n.toLocaleString('ko-KR')}
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
let W=0,H=0,DPR=1,Z=1,VR=600,vignette=null,redVig=null;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ================= SPRITES ================= */
const SPR={},SS=2;
function whiteOf(src){return mk(src.width,src.height,g=>{g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,src.width,src.height)})}
function enemySprite(key,r,draw,pad=14){const half=r+pad;const c=mk(half*2*SS,half*2*SS,g=>{g.scale(SS,SS);g.translate(half,half);draw(g,r)});SPR[key]={img:c,white:whiteOf(c),half,r}}
const GLOW={};
function glow(color,r){const k=color+'|'+r;if(GLOW[k])return GLOW[k];const s=Math.max(1,Math.ceil(r*4));const c=mk(s*2,s*2,g=>{const gr=g.createRadialGradient(s,s,0,s,s,s);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.16,hexA(color,1));gr.addColorStop(0.42,hexA(color,0.32));gr.addColorStop(1,hexA(color,0));g.fillStyle=gr;g.fillRect(0,0,s*2,s*2)});c._s=s;return GLOW[k]=c}
function drawGlow(color,r,x,y,a=1){const c=glow(color,Math.max(0.5,Math.round(r*2)/2));ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(c,x-c._s,y-c._s);ctx.globalAlpha=1}
function slimeShape(g,r,c1,c2,glowC){g.shadowColor=glowC;g.shadowBlur=14;const gr=g.createLinearGradient(0,-r,0,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;
 g.beginPath();g.moveTo(-r,r*0.65);g.quadraticCurveTo(-r*1.1,-r*1.05,0,-r);g.quadraticCurveTo(r*1.1,-r*1.05,r,r*0.65);g.quadraticCurveTo(0,r*1.0,-r,r*0.65);g.fill();g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-r*0.38,-r*0.5,r*0.22,r*0.13,-0.5,0,TAU);g.fill()}
function buildSprites(){
 enemySprite('slime',13,(g,r)=>{slimeShape(g,r,'#a8ffc9','#119c4b','#3dff8a');
  g.fillStyle='#062612';g.beginPath();g.ellipse(-r*0.32,r*0.02,r*0.15,r*0.21,0,0,TAU);g.ellipse(r*0.32,r*0.02,r*0.15,r*0.21,0,0,TAU);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-r*0.27,-r*0.06,r*0.06,0,TAU);g.arc(r*0.37,-r*0.06,r*0.06,0,TAU);g.fill()});
 enemySprite('splitter',19,(g,r)=>{slimeShape(g,r,'#e4ff9a','#5b8a12','#b2ff59');
  const cg=g.createRadialGradient(0,r*0.1,0,0,r*0.1,r*0.45);cg.addColorStop(0,'#fff');cg.addColorStop(0.4,'#ff4fd8');cg.addColorStop(1,'rgba(120,0,90,0)');g.fillStyle=cg;g.beginPath();g.arc(0,r*0.1,r*0.45,0,TAU);g.fill();
  g.fillStyle='#1b2a05';for(const s of[-1,1]){g.beginPath();g.ellipse(s*r*0.38,-r*0.3,r*0.12,r*0.17,0,0,TAU);g.fill()}
  g.strokeStyle='rgba(30,50,0,.55)';g.lineWidth=1.6;g.beginPath();g.moveTo(-r*0.1,-r*0.95);g.lineTo(r*0.05,-r*0.55);g.lineTo(-r*0.08,-r*0.2);g.stroke()});
 enemySprite('bat',10,(g,r)=>{g.shadowColor='#b56bff';g.shadowBlur=12;g.fillStyle='#5a23a8';
  for(const s of[-1,1]){g.beginPath();g.moveTo(s*r*0.5,-r*0.3);g.lineTo(s*r*2.0,-r*0.9);g.lineTo(s*r*1.7,-r*0.1);g.lineTo(s*r*1.95,r*0.35);g.lineTo(s*r*1.3,r*0.15);g.lineTo(s*r*1.1,r*0.6);g.lineTo(s*r*0.5,r*0.3);g.closePath();g.fill()}
  const gr=g.createRadialGradient(-r*0.3,-r*0.4,1,0,0,r);gr.addColorStop(0,'#e3c2ff');gr.addColorStop(1,'#7b35d6');g.fillStyle=gr;g.beginPath();g.arc(0,0,r*0.8,0,TAU);g.fill();
  g.beginPath();g.moveTo(-r*0.6,-r*0.5);g.lineTo(-r*0.45,-r*1.15);g.lineTo(-r*0.15,-r*0.65);g.moveTo(r*0.6,-r*0.5);g.lineTo(r*0.45,-r*1.15);g.lineTo(r*0.15,-r*0.65);g.fill();
  g.shadowColor='#ff2244';g.shadowBlur=6;g.fillStyle='#ff3355';g.beginPath();g.arc(-r*0.3,-r*0.05,r*0.16,0,TAU);g.arc(r*0.3,-r*0.05,r*0.16,0,TAU);g.fill()},20);
 enemySprite('wraith',14,(g,r)=>{g.shadowColor='#7b8cff';g.shadowBlur=16;const gr=g.createLinearGradient(0,-r,0,r*1.1);gr.addColorStop(0,'#c3cbff');gr.addColorStop(0.5,'#5562d9');gr.addColorStop(1,'rgba(40,40,120,.2)');g.fillStyle=gr;
  g.beginPath();g.arc(0,-r*0.1,r*0.95,Math.PI,0);g.lineTo(r*0.95,r*0.8);for(let i=0;i<=6;i++){const x=r*0.95-i*(r*1.9/6);g.lineTo(x,r*(i%2?0.55:1.05))}g.closePath();g.fill();g.shadowBlur=0;
  g.fillStyle='#0a0b25';g.beginPath();g.ellipse(0,-r*0.05,r*0.62,r*0.5,0,0,TAU);g.fill();
  g.shadowColor='#5ef2ff';g.shadowBlur=10;g.fillStyle='#bff8ff';g.beginPath();g.ellipse(-r*0.25,-r*0.08,r*0.12,r*0.18,0,0,TAU);g.ellipse(r*0.25,-r*0.08,r*0.12,r*0.18,0,0,TAU);g.fill()});
 enemySprite('wolf',13,(g,r)=>{g.shadowColor='#9fb4ff';g.shadowBlur=12;const gr=g.createLinearGradient(0,-r,0,r);gr.addColorStop(0,'#e8eef8');gr.addColorStop(1,'#4a5568');g.fillStyle=gr;
  g.beginPath();g.moveTo(-r*0.95,-r*0.25);g.lineTo(-r*0.75,-r*1.25);g.lineTo(-r*0.3,-r*0.7);g.lineTo(r*0.3,-r*0.7);g.lineTo(r*0.75,-r*1.25);g.lineTo(r*0.95,-r*0.25);g.quadraticCurveTo(r*0.9,r*0.55,0,r*1.05);g.quadraticCurveTo(-r*0.9,r*0.55,-r*0.95,-r*0.25);g.fill();g.shadowBlur=0;
  g.fillStyle='#2b3140';g.beginPath();g.ellipse(0,r*0.55,r*0.38,r*0.3,0,0,TAU);g.fill();g.fillStyle='#000';g.beginPath();g.ellipse(0,r*0.42,r*0.14,r*0.09,0,0,TAU);g.fill();
  g.shadowColor='#ffd166';g.shadowBlur=8;g.fillStyle='#ffe066';for(const s of[-1,1]){g.beginPath();g.moveTo(s*r*0.15,-r*0.15);g.lineTo(s*r*0.6,-r*0.3);g.lineTo(s*r*0.5,-r*0.05);g.closePath();g.fill()}g.shadowBlur=0});
 enemySprite('bomber',12,(g,r)=>{g.shadowColor='#ff5a3c';g.shadowBlur=14;const gr=g.createRadialGradient(-r*0.3,-r*0.4,1,0,0,r);gr.addColorStop(0,'#ffb199');gr.addColorStop(1,'#b3170b');g.fillStyle=gr;g.beginPath();g.arc(0,r*0.1,r,0,TAU);g.fill();g.shadowBlur=0;
  g.strokeStyle='rgba(40,0,0,.6)';g.lineWidth=2.4;g.beginPath();g.moveTo(-r*0.9,0);g.quadraticCurveTo(0,r*0.35,r*0.9,0);g.stroke();
  g.strokeStyle='#3a2a1a';g.lineWidth=2;g.beginPath();g.moveTo(0,-r*0.85);g.quadraticCurveTo(r*0.35,-r*1.3,r*0.15,-r*1.55);g.stroke();
  g.shadowColor='#ffd166';g.shadowBlur=10;g.fillStyle='#fff3a0';g.beginPath();g.arc(r*0.15,-r*1.58,r*0.2,0,TAU);g.fill();g.shadowBlur=0;
  g.fillStyle='#fff';g.beginPath();g.arc(-r*0.35,-r*0.25,r*0.17,0,TAU);g.arc(r*0.35,-r*0.25,r*0.17,0,TAU);g.fill();g.fillStyle='#000';g.beginPath();g.arc(-r*0.32,-r*0.22,r*0.08,0,TAU);g.arc(r*0.38,-r*0.22,r*0.08,0,TAU);g.fill()},18);
 enemySprite('caster',13,(g,r)=>{g.shadowColor='#ff4fd8';g.shadowBlur=14;const gr=g.createLinearGradient(0,-r,0,r);gr.addColorStop(0,'#5a1f7a');gr.addColorStop(1,'#1b0627');g.fillStyle=gr;
  g.beginPath();g.moveTo(0,-r*1.25);g.quadraticCurveTo(r*0.5,-r*0.6,r*0.95,r*0.95);g.lineTo(-r*0.95,r*0.95);g.quadraticCurveTo(-r*0.5,-r*0.6,0,-r*1.25);g.fill();g.shadowBlur=0;
  g.strokeStyle='#ff4fd8';g.lineWidth=1.6;g.beginPath();g.moveTo(-r*0.95,r*0.95);g.lineTo(r*0.95,r*0.95);g.stroke();
  g.fillStyle='#0a0010';g.beginPath();g.ellipse(0,-r*0.15,r*0.38,r*0.3,0,0,TAU);g.fill();
  g.shadowColor='#ff4fd8';g.shadowBlur=8;g.fillStyle='#ffb3f0';g.beginPath();g.arc(-r*0.15,-r*0.17,r*0.08,0,TAU);g.arc(r*0.15,-r*0.17,r*0.08,0,TAU);g.fill();

let AC=null,master=null,musicGain=null,sfxGain=null,noiseBuf=null,muted=lsGet('nf_muted2',false);
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.55;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;master.connect(comp);comp.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.42;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=0.9;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,dur,type,vol,f2,when,dest){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+0.03)}
function noise(dur,vol,freq,type,when,dest){if(!AC)return;const t=when||AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=freq||2000;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||sfxGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03)}

const Music={timer:null,step:0,next:0,intense:false,
 start(){if(!AC||this.timer)return;this.next=AC.currentTime+0.1;this.step=0;this.timer=setInterval(()=>this.sched(),40)},
 stop(){if(this.timer){clearInterval(this.timer);this.timer=null}},
 sched(){if(!AC)return;const bpm=this.intense?150:128;const spb=60/bpm/4;while(this.next<AC.currentTime+0.16){this.play(this.step,this.next,spb);this.next+=spb;this.step=(this.step+1)%64}},
 play(s,t,spb){const m=n=>440*Math.pow(2,(n-69)/12);const roots=[45,41,43,40];const root=roots[(s>>4)%4];const st=s%16;const mg=musicGain;
  if(st%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.13);g.gain.setValueAtTime(0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.connect(g);g.connect(mg);o.start(t);o.stop(t+0.2)}
  if(st%4===2||(this.intense&&st%2===1))noise(0.04,this.intense?0.05:0.035,8000,'highpass',t,mg);
  if(this.intense&&(st===4||st===12))noise(0.14,0.12,1800,'bandpass',t,mg);
  if([0,3,6,8,10,11,14].includes(st)){const n=root+(st===6||st===14?12:0);const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=m(n);f.type='lowpass';f.frequency.setValueAtTime(this.intense?900:600,t);f.frequency.exponentialRampToValueAtTime(150,t+spb*1.8);g.gain.setValueAtTime(0.14,t);g.gain.exponentialRampToValueAtTime(0.001,t+spb*1.9);o.connect(f);f.connect(g);g.connect(mg);o.start(t);o.stop(t+spb*2)}
  if(st%2===0){const arp=[0,3,7,10,12,10,7,3];tone(m(root+24+arp[(st/2)%8]),0.12,'square',this.intense?0.022:0.016,0,t,mg)}
  if(st===0&&(s>>4)%2===0)tone(m(root+36),spb*7,'triangle',0.02,0,t,mg)}};

let LOAD=lsGet('nf_load',{});
function getLoad(cid){const l=LOAD[cid]||{};return{g:l.g===1?1:0,s:l.s===1?1:0}}
function setLoad(cid,k,v){LOAD[cid]=Object.assign(getLoad(cid),{[k]:v});lsSet('nf_load',LOAD)}
function fxP(st,k){if(!st)return null;for(const [kk,o] of st.fx)if(kk===k)return o;return null}
function fstat(...lists){const o={};for(const l of lists){const st=fxP(l,'stat');if(st)for(const k in st)o[k]=(o[k]||0)+st[k]}return o}
function charT(c){return c&&c.tfx&&c.tfx.length?{fx:c.tfx}:null}
function starP(k){return P?(fxP(P.star,k)||fxP(charT(P.char),k)):null}

function drawSaw(x,y,r,sp){drawGlow('#ffd23f',r*0.6,x,y,0.7);ctx.save();ctx.translate(x,y);ctx.rotate(sp);ctx.fillStyle='#fff3c0';ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*TAU,rr=i%2?r:r*0.72;i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.fillStyle='#8a6a10';ctx.beginPath();ctx.arc(0,0,r*0.25,0,TAU);ctx.fill();ctx.restore()}
function jag(x1,y1,x2,y2,seg,amp){const pts=[[x1,y1]];const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;for(let i=1;i<seg;i++){const t=i/seg,o=rand(-amp,amp);pts.push([x1+dx*t+nx*o,y1+dy*t+ny*o])}pts.push([x2,y2]);return pts}

 rebuild(){const self={peer:EXT.peer,by:EXT.id,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:Object.freeze(Object.assign({},this.my)),updatedAt:Date.now()};this.snap=Object.freeze([self,...this.map.values()]);
